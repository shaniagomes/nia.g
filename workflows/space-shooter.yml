name: Generate 2021 Space Shooter Game

on:
  schedule:
    - cron: '0 0 1 1 *' # Runs once a year since 2021 data is static, preventing redundant runs
  workflow_dispatch: # Allows you to manually click a button to run it immediately

permissions:
  contents: write

jobs:
  update-game:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install and Run Space Shooter for 2021
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pip install --upgrade pip
          pip install gh-space-shooter
          # Explicitly calling the CLI tool to scrape your 2021 timeline parameters
          gh-space-shooter shaniagomes --output 2021-space-shooter.gif --strategy random

      - name: Commit and Push Generated Game GIF
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add 2021-space-shooter.gif
          git commit -m "Update retro space shooter asset for 2021 metrics" || echo "No changes to commit"
          git push
